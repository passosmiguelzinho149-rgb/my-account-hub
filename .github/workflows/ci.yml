name: Verificação do projeto

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código
        uses: actions/checkout@v4
      - name: Configurar Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Instalar dependências
        run: bun install --frozen-lockfile
      - name: Verificar build
        run: bun run build
      - name: Verificar lint
        continue-on-error: true
        run: bun run lint
